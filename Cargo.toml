[package]
name = "event-horizon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Automated guard-railed RTBH and FlowSpec DDoS mitigation over BGP"
license = "MIT"
repository = "https://github.com/LLCForge/Event-Horizon"
authors = ["LLCForge contributors"]
readme = "README.md"
keywords = ["bgp", "rtbh", "ddos", "flowspec", "networking"]
categories = ["network-programming", "command-line-utilities"]

[workspace]
members = [".", "crates/llcforge-beacon"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
ipnet = { version = "2", features = ["serde"] }
llcforge-beacon = { path = "crates/llcforge-beacon", version = "0.1" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.2"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.deb]
maintainer = "LLCForge contributors <https://github.com/LLCForge>"
copyright = "2026, LLCForge contributors"
license-file = ["LICENSE", "0"]
extended-description = "Automated guard-railed RTBH and FlowSpec DDoS mitigation over BGP"
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/event-horizon", "usr/bin/", "755"],
    ["event-horizon.example.toml", "etc/event-horizon/event-horizon.toml", "644"],
    ["README.md", "usr/share/doc/event-horizon/README.md", "644"],
    ["NOTICE", "usr/share/doc/event-horizon/NOTICE", "644"],
]
conf-files = ["/etc/event-horizon/event-horizon.toml"]
# Installs packaging/systemd/event-horizon.service and the matching maintainer scripts;
# the unit is not enabled automatically (configure first, then enable).
systemd-units = { unit-name = "event-horizon", unit-scripts = "packaging/systemd", enable = false, start = false }

[package.metadata.generate-rpm]
license = "MIT"
summary = "Automated guard-railed RTBH and FlowSpec DDoS mitigation over BGP"
assets = [
    { source = "target/release/event-horizon", dest = "/usr/bin/event-horizon", mode = "755" },
    { source = "packaging/systemd/event-horizon.service", dest = "/usr/lib/systemd/system/event-horizon.service", mode = "644" },
    { source = "event-horizon.example.toml", dest = "/etc/event-horizon/event-horizon.toml", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/event-horizon/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/event-horizon/LICENSE", mode = "644", doc = true },
]
post_install_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
post_uninstall_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
